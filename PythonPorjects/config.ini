; ================================================================================
; HOST IP CONFIGURATION - IMPORTANT
; ================================================================================
; You will see the Host IP address (e.g., 10.0.0.6) in MULTIPLE places below:
;   1. [Offline] host_ip          ← PRIMARY - This is the single source of truth
;   2. [Network] host             ← Auto-synced copy (for legacy compatibility)
;   3. [Fusers] working_folder_host ← Auto-synced copy (for legacy compatibility)
;   4. [Fusers] shared_working_unc  ← Auto-rebuilt from host_ip + share_name
;
; WHY? Legacy code reads from different config locations. Rather than breaking
; compatibility, we keep ONE primary source ([Offline] host_ip) and automatically
; sync all copies whenever you change the IP in Settings.
;
; TO CHANGE THE HOST IP:
;   - Use the Settings panel in the application (recommended)
;   - Or edit [Offline] host_ip manually and restart the app (it will sync others)
;
; The sync happens:
;   - When you click "Save" on the Host IP field in Settings
;   - On every application startup (ensures consistency)
; ================================================================================

